name: Доступ к библиотеке растений
description: Запросить доступ для своего GitHub-аккаунта
title: '[Доступ] Библиотека растений'
labels: [access-request]
body:
  - type: markdown
    attributes:
      value: |
        Заявка публичная. Пароли, токены, текстуры и рабочие документы здесь не нужны.
        Приглашение получит GitHub-аккаунт, от которого создана эта заявка.
        Владелец библиотеки проверит заявку и поставит метку одобрения.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Подтверждение
      options:
        - label: Я запрашиваю доступ для своего аккаунта, чтобы пользоваться библиотекой команды и добавлять растения.
          required: true
